schema_version = "1.1"

[task]
name = "afterquery/bywash-lock-flight"
description = "A volunteer lock-keeper cannot trust Bywash to plan a passage up the Marsden flight: lockfuls come out twelve times too large, a pound drawn to exactly its permitted depth is condemned, chambers are charged to the wrong water, the wall a staircase pair shares is treated as though a pound lay behind it, water sent back into a pound is never credited so the account will not balance, gates open against a head of water and with paddles still up, a refused plan carries on being worked, chambers are counted as passed before the boat has been near them, and the flight elevation collapses in on itself in a narrow window."
authors = [{ name = "Bywash Task Author", email = "author@local.invalid" }]
keywords = ["inland-waterways", "lock-flight", "water-budget", "interlocks", "responsive-ui"]


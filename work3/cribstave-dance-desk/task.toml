schema_version = "1.1"

[task]
name = "sand/cribstave-dance-desk"
description = "Cribstave is a desk for checking a Scottish country dance crib: the devisor writes the dance out phrase by phrase, each line opening with the bars it covers, and the desk reads the notation, walks the four couples through every figure, and reports what is wrong against the line and bar it was written on. It currently passes nothing. Well-formed cribs are told bars are missing that are plainly written, real gaps are blamed on the wrong bar and duplicated bars pass unremarked, figures printed in the desk's own book are refused or counted at half their length, spans written with an en dash are not read at all, a phrase carried onto a second line loses the figures above it, and the walk has no grip on where the couples are standing, so legal figures are refused, illegal ones pass, dances that never hand the set on are approved, and couples sent across the set are never brought home. Faults are filed under the bar the phrase opens on instead of the figure at fault, the report shows only the first of them, and on screen the margin numbering has drifted out of step with the lines it counts while the set diagram's place headings have slipped off the couples standing in them."
authors = [{ name = "Ankit Chauhan", email = "ankit.chauhan@example.com" }]
keywords = ["notation", "parsing", "validation", "state-machine", "layout", "full-stack"]

